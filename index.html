<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>הפודקאסט שלי</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1em;
            color: #555;
            line-height: 1.6;
        }
        .rss-link {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #1db954;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .rss-link:hover {
            background-color: #1aa34a;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>הפודקאסט שלי</h1>
        <p>ברוכים הבאים לעמוד הפודקאסט הרשמי! כאן תוכלו למצוא את כל הפרקים המלאים מתוך ערוץ היוטיוב שלנו, זמינים להאזנה בכל פלטפורמות הפודקאסטים המובילות.</p>
        <p>כדי להאזין, חפשו אותנו באפליקציות ההאזנה או העתיקו את קישור ה-RSS שלנו:</p>
        <a href="rss.xml" class="rss-link">🔗 העתק קישור RSS</a>
        <div class="footer">
            מופק באוטומציה מיוטיוב
        </div>
    </div>
</body>
</html>
