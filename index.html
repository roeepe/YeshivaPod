<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>פודקאסט אתר ישיבה | Yeshiva.org.il Podcast</title>
    <meta name="description" content="הפודקאסט הרשמי של אתר ישיבה. כל השיעורים וההרצאות זמינים להאזנה בכל זמן ובכל מקום.">
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a4a76;
            --primary-light: #2c75b8;
            --secondary: #f0a500;
            --bg-color: #0f172a;
            --surface: rgba(255, 255, 255, 0.05);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Heebo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Gradients */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--primary-light) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            opacity: 0.15;
            filter: blur(60px);
            animation: pulse 8s infinite alternate;
            z-index: -1;
        }

        .bg-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--secondary) 0%, transparent 70%);
            bottom: -100px;
            left: -150px;
            opacity: 0.1;
            filter: blur(60px);
            animation: pulse 12s infinite alternate-reverse;
            z-index: -1;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-20px, 20px); }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Glassmorphism Card */
        .glass-card {
            background: var(--surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            padding: 60px 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 10;
        }

        .glass-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Logo & Header */
        .logo-container {
            margin-bottom: 30px;
            display: inline-block;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo-img {
            max-height: 80px;
            width: auto;
            object-fit: contain;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, #a5cbf0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 40px;
            line-height: 1.8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Links & Buttons */
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            border-radius: 100px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(26, 74, 118, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(26, 74, 118, 0.4);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 2px solid var(--surface-border);
        }

        .btn-outline:hover {
            background: var(--surface);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        /* Podcast Platforms (Hidden for now) */
        .platforms-section {
            display: none; /* User requested to hide these blocks for now */
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--surface-border);
        }

        .platforms-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .platforms-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .platform-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--surface-border);
            border-radius: 16px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .platform-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        /* SVG Icons */
        .icon {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        /* Footer */
        footer {
            padding: 30px;
            text-align: center;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.9rem;
            z-index: 10;
        }

        footer a {
            color: var(--primary-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .title { font-size: 2.5rem; }
            .glass-card { padding: 40px 20px; }
            .actions { flex-direction: column; }
            .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Background Gradients -->
    <div class="bg-glow"></div>
    <div class="bg-glow-2"></div>

    <main class="container">
        <div class="glass-card">
            
            <div class="logo-container">
                <img src="yeshivaLogo.png" alt="אתר ישיבה - Logo" class="logo-img" onerror="this.src='https://www.yeshiva.org.il/images/logo.png'">
            </div>

            <h1 class="title">הפודקאסט של אתר ישיבה</h1>
            
            <p class="subtitle">
                כל השיעורים, ההרצאות והשיחות של רבני אתר ישיבה, עכשיו זמינים להאזנה בכל פלטפורמות הפודקאסטים המובילות. התחברו לתוכן תורני איכותי בכל זמן ובכל מקום.
            </p>

            <div class="actions">
                <a href="rss.xml" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 11A9 9 0 0 1 13 20H11A7 7 0 0 0 4 13V11ZM4 4A16 16 0 0 1 20 20H18A14 14 0 0 0 4 6V4ZM6 16A2 2 0 1 1 4 18A2 2 0 0 1 6 16Z"/>
                    </svg>
                    העתק קישור RSS
                </a>
                
                <a href="https://www.youtube.com/@yeshiva-org-il" target="_blank" class="btn btn-outline">
                    <svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                    ערוץ היוטיוב שלנו
                </a>
            </div>

            <!-- Future Platform Links Section -->
            <div class="platforms-section" id="platforms">
                <h3 class="platforms-title">האזינו עכשיו ב:</h3>
                <div class="platforms-grid">
                    <a href="#" class="platform-card">
                        <svg class="icon" style="color: #1DB954;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.54.659.301 1.02zm1.44-3.3c-.301.42-.84.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.84.241 1.2zM20.16 9.6C16.44 7.38 9.54 7.14 5.58 8.4c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.68-1.44 12.24-1.14 16.62 1.5.54.3 0.72 1.02.42 1.56-.24.54-.96.72-1.5.42z"/></svg>
                        Spotify
                    </a>
                    <a href="#" class="platform-card">
                        <svg class="icon" style="color: #AA66CC;" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm.014 5.086c1.393 0 2.536 1.137 2.536 2.522 0 1.385-1.143 2.52-2.536 2.52-1.4 0-2.544-1.135-2.544-2.52 0-1.385 1.143-2.522 2.544-2.522zM8.307 19c-1.325 0-2.408-1.076-2.408-2.394 0-1.319 1.083-2.396 2.408-2.396 1.332 0 2.416 1.077 2.416 2.396 0 1.318-1.084 2.394-2.416 2.394zm7.386 0c-1.326 0-2.41-1.076-2.41-2.394 0-1.319 1.084-2.396 2.41-2.396 1.33 0 2.414 1.077 2.414 2.396 0 1.318-1.084 2.394-2.414 2.394z"/></svg>
                        Apple Podcasts
                    </a>
                </div>
            </div>

        </div>
    </main>

    <footer>
        <p>מופק באוטומציה עבור <a href="https://www.yeshiva.org.il/" target="_blank">אתר ישיבה</a> © 2026</p>
    </footer>

    <script>
        // Copy RSS link to clipboard
        document.querySelector('.btn-primary').addEventListener('click', function(e) {
            e.preventDefault();
            const rssUrl = new URL(this.getAttribute('href'), window.location.href).href;
            
            navigator.clipboard.writeText(rssUrl).then(() => {
                const originalHtml = this.innerHTML;
                this.innerHTML = '<svg class="icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> הועתק בהצלחה!';
                this.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                
                setTimeout(() => {
                    this.innerHTML = originalHtml;
                    this.style.background = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
