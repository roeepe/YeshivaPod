name: Update Podcast RSS Feed

on:
  schedule:
    # Run twice a week: Sunday and Monday at 02:00 UTC
    - cron: '0 2 * * 0,1'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  update-feed:
    runs-on: ubuntu-latest
    
    # We need contents: write permission to commit back to the repo and create releases
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # yt-dlp requires ffmpeg for audio extraction
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Run podcast updater script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python podcast_updater.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add episodes.json rss.xml
          # Only commit if there are changes
          git diff --staged --quiet || (git commit -m "Automated podcast feed update" && git push)
